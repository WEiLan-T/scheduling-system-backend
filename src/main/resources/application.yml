spring:
  servlet:
    multipart:
      # Excel 导入大小限制（默认仅 1MB，会报 Maximum upload size exceeded）
      max-file-size: 50MB
      max-request-size: 100MB
  datasource:
    url: jdbc:postgresql://localhost:5432/scheduling_db?sslmode=prefer
    username: postgres
    password: 825809 # 请修改为您本地的密码
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # update: 仅根据实体增量更新表结构，绝不清空数据（create 会在每次启动时删库，禁用！）
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

python:
  executable:
    path: python
  script:
    path: scripts/data_cleaner.py